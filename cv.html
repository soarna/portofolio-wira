<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curriculum Vitae — Wiradharma Putra</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

  :root{
    --white:      #ffffff;
    --paper:      #ecfbfd;
    --ink:        #0c2b30;
    --ink-dim:    #4c7278;
    --line:       #cdeef3;
    --sage:       #0891b2;
    --sage-deep:  #164e63;
    --sage-soft:  #ecfeff;
    --rose:       #67e8f9;
    --moon:       #a5f3fc;
    --moon-line:  #22d3ee;

    --font-display: 'Fraunces', 'Georgia', serif;
    --font-body: 'Inter', -apple-system, sans-serif;

    --maxw: 1160px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--white);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16.5px;
    line-height:1.65;
  }

  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  ul{ list-style:none; }

  /* ============ NAVBAR ============ */
  header.navbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:26px 6vw;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .navbar .brand{
    font-family:var(--font-display);
    font-weight:560;
    font-size:19px;
    letter-spacing:.01em;
  }
  .navbar nav{ display:flex; gap:clamp(4px,1.4vw,10px); }
  .navbar nav a{
    font-size:13.5px;
    letter-spacing:.03em;
    color:var(--ink-dim);
    padding:9px 18px;
    border-radius:20px;
    transition:background .25s ease, color .25s ease;
  }
  .navbar nav a:hover, .navbar nav a:focus-visible{ color:var(--sage-deep); background:var(--sage-soft); }
  .navbar nav a:focus-visible{ outline:2px solid var(--sage); outline-offset:2px; }
  .navbar nav a.active{ color:var(--white); background:var(--sage); }

  .btn{
    font-size:13.5px;
    font-weight:600;
    letter-spacing:.02em;
    padding:14px 26px;
    border-radius:3px;
    transition:all .3s ease;
    display:inline-block;
  }
  .btn-primary{
    background:var(--sage-deep);
    color:var(--white);
  }
  .btn-primary:hover, .btn-primary:focus-visible{ background:var(--sage); transform:translateY(-2px); }
  .btn-outline{
    border:1px solid var(--ink);
    color:var(--ink);
  }
  .btn-outline:hover, .btn-outline:focus-visible{
    background:var(--ink); color:var(--white); transform:translateY(-2px);
  }
  .btn:focus-visible{ outline:2px solid var(--sage); outline-offset:3px; }
  .btn svg{ vertical-align:-2px; margin-right:6px; }

  /* ============ SECTION UMUM ============ */
  .section-inner{
    max-width:var(--maxw);
    margin:0 auto;
    padding:150px 6vw 110px;
  }
  .section-head{ margin-bottom:48px; max-width:560px; }
  .eyebrow{
    font-size:12.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--sage);
    font-weight:600;
    margin-bottom:16px;
  }
  .section-head h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(28px,3.6vw,38px);
    margin-top:8px;
  }
  .section-head p{ color:var(--ink-dim); margin-top:12px; font-size:16px; }

  /* ============ CV PANEL: PDF + TOMBOL ============ */
  .cv-layout{
    display:flex;
    gap:40px;
    align-items:stretch;
  }
  .cv-viewer{
    flex:1 1 68%;
    min-width:0;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:var(--paper);
    box-shadow:0 24px 50px -30px rgba(16,26,46,.2);
  }
  .cv-viewer embed,
  .cv-viewer iframe{
    width:100%;
    height:min(160vh, 1800px);
    border:0;
    display:block;
  }
  .cv-side{
    flex:0 0 280px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .cv-side-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:26px 24px;
  }
  .cv-side-card h3{
    font-family:var(--font-display);
    font-size:18px;
    margin-bottom:10px;
  }
  .cv-side-card p{
    color:var(--ink-dim);
    font-size:14.5px;
    margin-bottom:20px;
  }
  .cv-side-card .btn{ width:100%; text-align:center; }

  footer{
    text-align:center;
    padding:44px 6vw;
    border-top:1px solid var(--line);
    color:var(--ink-dim);
    font-size:13px;
    letter-spacing:.03em;
  }

  /* ============ RESPONSIF ============ */
  @media (max-width:860px){
    .cv-layout{ flex-direction:column; }
    .cv-side{ flex:0 0 auto; flex-direction:row; }
    .cv-side-card{ flex:1; }
    .cv-viewer embed, .cv-viewer iframe{ height:130vh; }
  }
  @media (max-width:600px){
    .navbar{ padding:18px 5vw; }
    .navbar nav{ gap:14px; }
    .navbar nav a{ font-size:11.5px; }
    .section-inner{ padding:120px 6vw 80px; }
    .cv-side{ flex-direction:column; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.001ms !important; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<!-- ============ NAVBAR (sama dengan halaman utama) ============ -->
<header class="navbar">
  <span class="brand">Blog Portofolio</span>
  <nav aria-label="Navigasi utama">
    <a href="index.html">Biografi</a>
    <a href="cv.html" class="active">Curriculum Vitae</a>
    <a href="project.html">Project</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<!-- ============ CURRICULUM VITAE ============ -->
<section id="cv" class="section-inner">
  <div class="section-head">
    <p class="eyebrow">Riwayat Hidup</p>
    <h2>Curriculum Vitae</h2>
    <p>Berikut adalah informasi seputar riwayat hidup
      yang saya miliki yang disimpan berupa Curriculum Vitae atau CV</p>
  </div>

  <div class="cv-layout">
    <!-- Penampil PDF -->
    <div class="cv-viewer">
      <embed src="cv.pdf" type="application/pdf" />
    </div>

    <!-- Tombol unduh & info singkat -->
    <div class="cv-side">
      <div class="cv-side-card">
        <a class="btn btn-primary" href="cv.pdf" download>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          Unduh CV
        </a>
      </div>
    </div>
  </div>
</section>

<footer>Terima kasih atas membaca Portofolio ini || Wiradharma Putra || 2026</footer>

</body>
</html>
